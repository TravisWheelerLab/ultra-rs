[package]
name = "ultrafast"
version = "0.1.0"
edition = "2021"
description = "Hybrid tandem-repeat annotator: FasTAN for long periods, ULTRA for short ones, ULTRA-format output"
license = "BSD-3-Clause"
repository = "https://github.com/TravisWheelerLab/ultra-rs"
publish = false

[lib]
name = "ultrafast"
path = "src/lib.rs"

[[bin]]
name = "ultrafast"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ultra-repeats = { path = ".." }
