[package]
name = "ultra-repeats"
version = "0.2.0"
edition = "2021"
description = "Rust port of ULTRA, a tool for finding and annotating tandem repeats in genomic sequence"
license = "BSD-3-Clause"
repository = "https://github.com/TravisWheelerLab/ultra-rs"
readme = "README.md"
keywords = ["tandem-repeats", "bioinformatics", "genomics", "repeats", "hmm"]
categories = [
    "science::bioinformatics::sequence-analysis",
    "science::bioinformatics::genomics",
    "command-line-utilities",
]

[lib]
name = "ultra_repeats"
path = "src/lib.rs"

[[bin]]
name = "ultra"
path = "src/main.rs"

[dependencies]

# ultrafast/ (the FasTAN + ULTRA hybrid) is a separate crate so the ultra library
# keeps no dependencies. `cargo build --release` here builds ultra only;
# `cargo build --release -p ultrafast` builds the hybrid.
[workspace]
members = [".", "ultrafast"]

[profile.release]
opt-level = 3
debug = false

[profile.release.package.ultrafast]
codegen-units = 1
