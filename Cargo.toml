[package]
name = "ultra-repeats"
version.workspace = true
edition = "2021"
description = "Rust port of ULTRA, a tool for finding and annotating tandem repeats in genomic sequence"
license = "BSD-3-Clause"
repository = "https://github.com/TravisWheelerLab/ultra-rs"
readme = "README.md"
exclude = [".github/", "tests/snapshots/", "tests/snapshots.rs", "tests/common/snapshot.rs"]
keywords = ["tandem-repeats", "bioinformatics", "genomics", "repeats", "hmm"]
categories = [
    "science::bioinformatics::sequence-analysis",
    "science::bioinformatics::genomics",
    "command-line-utilities",
]

[lib]
name = "ultra_repeats"
path = "src/lib.rs"

[[bin]]
name = "ultra"
path = "src/main.rs"

[dependencies]

# ultrafast/ (the FasTAN + ULTRA hybrid) is a separate crate so the ultra library
# keeps no dependencies. `cargo build --release` here builds both tools.
# Publishing: `cargo publish -p ultra-repeats` (ultrafast is not published, so a
# plain `cargo publish` stops with "ultrafast cannot be published").
[workspace]
members = [".", "ultrafast"]
default-members = [".", "ultrafast"]

# One version for both crates: set it here only.
[workspace.package]
version = "0.3.0"

[profile.release]
opt-level = 3
debug = false
codegen-units = 1
